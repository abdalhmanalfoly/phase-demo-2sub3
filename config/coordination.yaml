# Phase 3: Coordination Agent (Contract Net-style task allocation). Every value is a STARTING POINT to measure and tune on the real rig.
# Loaded by host/app/coordination/config.py (unknown keys are rejected; weights must sum to 1; leases are always bounded).
weights:                       # offer quality = sum(weight * normalised component). Configurable baseline, NOT a proven optimum.
  detector_confidence: 0.30
  visibility: 0.20
  freshness: 0.20
  sync: 0.15
  health: 0.15
scoring:
  freshness_horizon_ms: 250.0        # age at which freshness_score hits 0
  sync_jitter_horizon_ms: 50.0       # delay jitter at which sync_score hits 0
  health_degraded_factor: 0.4
  rate_full_hz: 10.0
  edge_margin_frac: 0.05
  imputed_detector_confidence: 0.5   # the hand model reports no confidence; value is imputed AND flagged in the offer
  assumed_latency_ms: 100.0
eligibility:
  max_observation_age_ms: 250.0
  min_visibility: 0.2
  min_detector_confidence: 0.2
  min_health: 0.3
  require_calibration: true
task:
  offer_collect_ms: 150.0
  deadline_ms: 400.0                 # offers after this are rejected (OFFER_LATE); no award after it either
  window_ms: 250.0
  lease_ms: 2000.0
  max_lease_ms: 5000.0               # hard cap on any lease
  renew_lead_ms: 300.0
  recent_tasks: 32
set_selection:                       # set POLICY, separate from the offer score
  min_views: 2
  max_set_size: 3
  max_skew_ms: 50.0                  # = fusion.yaml sync.max_skew_ms
  min_view_angle_deg: 10.0           # stricter than fusion triangulation.min_ray_angle_deg (2.0)
  good_view_angle_deg: 30.0
  max_ray_gap_m: 0.10
  max_latency_ms: 150.0
  w_quality: 0.50
  w_geometry: 0.35
  w_sync: 0.15
  size_penalty: 0.02
  failed_set_ban_ms: 3000.0
  max_candidates: 6
adaptation:
  fusion_max_reprojection_px: 4.0    # stricter than fusion.yaml triangulation.max_reprojection_error_px (6.0)
  poor_results_before_reselect: 3
  max_reselect_attempts: 3
  fusion_silence_ms: 600.0
  degraded_retry_ms: 500.0
  degraded_retry_max_ms: 4000.0
  sensor_silence_timeout_ms: 1500.0  # no SENSOR_STATUS for this long -> treated as disconnected
  disconnect_grace_ms: 500.0         # reported disconnect/offline of a lease member tolerated this long
  allow_single_view_approximate: false
subtract_half_pixel: true            # must equal fusion.yaml spatial.subtract_half_pixel
